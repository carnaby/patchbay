# Patchbay on a home server or NAS, published through a Cloudflare Tunnel.
# No port is opened on the host: cloudflared dials out to Cloudflare, which terminates TLS and forwards
# requests to http://patchbay:8787 on this project's private network. See guide/deployment.md.
#
#   cp .env.example .env                    # PUID/PGID, PATCHBAY_DOMAIN, TUNNEL_TOKEN
#   cp patchbay.env.example patchbay.env    # Google OAuth, ADMIN_EMAILS, ...
#   mkdir data                              # owned by PUID:PGID
#   docker compose up -d
services:
  patchbay:
    image: ghcr.io/carnaby/patchbay:${PATCHBAY_TAG:-latest}
    restart: unless-stopped
    # Matches the owner of ./data, so the bind mount is writable without chown or root.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    env_file: patchbay.env
    environment:
      PUBLIC_URL: https://${PATCHBAY_DOMAIN:?set PATCHBAY_DOMAIN in .env}
      # Every request arrives through Cloudflare (no published port), so CF-Connecting-IP can be trusted.
      TRUST_PROXY: cloudflare
      # One worker keeps large inputs off the main thread on a 2-core CPU without doubling memory.
      PIPELINE_WORKERS: "1"
      # Anyone can create anonymous dashboards here, so they expire: 60 days without a view, or 24 hours when
      # still blank. The ceiling caps what they may take on the NAS disk in total (MB).
      PRUNE_ANONYMOUS_AFTER_DAYS: "60"
      PRUNE_BLANK_ANONYMOUS_AFTER_HOURS: "24"
      ANONYMOUS_STORAGE_LIMIT_MB: "1024"
      # Anyone with a Google account can sign in, so each account's dashboards are capped too (MB; admins exempt).
      USER_STORAGE_LIMIT_MB: "500"
      # Served from a home connection: only dashboards with a signed-in owner may make it fetch URLs.
      URL_SOURCES: signed-in
      # Optional Umami analytics, from .env (see guide/deployment.md). Empty means off. Set here, these override
      # patchbay.env, so put them in .env.
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    volumes:
      - ./data:/data
    # Measured (guide/deployment.md, "Memory budget"): ~90 MB idle; the combined attack storm peaks near 410 MB, and
    # the memory guard refuses new heavy work long before the limit. Agreed with the infra admin on 2026-10-31.
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    # Pinned on purpose: bump it by hand after reading the release notes.
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Read from the environment rather than a flag, so the token does not show up in `ps`.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - patchbay
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *logging
